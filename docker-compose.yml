# Reference compose (merge into your infra file). Single service: the
# gateway now serves the page (/) and the API (/dev/*) on :8090, so the
# standalone :8000 static server and the NPM custom location are obsolete.
# Uses host networking like the other Pi services so 192.168.169.1 is
# reachable over the host's wlan0.
services:
  cam-gateway:
    build: .
    image: v720-cam-gateway:latest
    network_mode: host
    restart: unless-stopped
    # Local secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID). Create
    # docker/telegram.env next to this file; it is git-ignored.
    env_file:
      - path: docker/telegram.env
        required: false
    environment:
      - SNAP_DIR=/data/snapshots
      # Periodic snapshots, seconds between captures (0 disables).
      # - SNAP_EVERY_SEC=300
      # Event capture: grab every N sec, keep motion+faces only.
      # Skips while the camera is busy (never fights live viewing).
      - FACE_WATCH_SEC=20
      # Local retention, days to keep snapshots/clips (0 disables).
      # - SNAP_RETENTION_DAYS=7
    volumes:
      - ./snapshots:/data/snapshots
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/dev/list')\""]
      interval: 30s
      timeout: 5s
      retries: 3
