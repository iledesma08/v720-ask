<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera — live</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
article.cam { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
img.live { width: 100%; max-width: 640px; display: block; background: #000; }
.nota { background: #fff8e1; border: 1px solid #e0c36a; border-radius: 8px; padding: .75rem 1rem; }
.error { color: #a00; }
.status { font-size: .8rem; font-weight: normal; margin-left: .5rem; }
.status.on { color: #0a0; }
.status.off { color: #a00; }
.msg { font-size: .9rem; color: #060; }
button { margin-right: 1rem; }
nav a { margin-right: 1rem; }
</style>
</head>
<body>
<h1>Camera — live</h1>
<p class="nota"><strong>One viewer at a time:</strong> if another client is watching the live feed,
the gateway responds <code>503 camera busy</code>. Wait until it is released and reload the page.</p>
<div id="lista" aria-live="polite"><p>Loading cameras…</p></div>
<p id="error" class="error" role="alert" hidden></p>
<nav><a href="dev/list">/dev/list (JSON)</a></nav>
<script>
// Minimal passthrough, no dependencies.
// All same-origin with relative URLs: works when served alongside the /dev/* proxy.
// Auto-refresh-friendly markup: each camera is <article class="cam" data-uid>
// with a stable <img id="live-<uid>" class="live"> across reloads.
(function () {
  var lista = document.getElementById('lista');
  var error = document.getElementById('error');

  function mostrarError(msg) {
    error.textContent = msg;
    error.hidden = false;
  }

  fetch('dev/list', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('GET dev/list → HTTP ' + r.status);
      return r.json();
    })
    .then(function (cams) {
      if (!Array.isArray(cams) || cams.length === 0) {
        lista.innerHTML = '<p>No cameras registered.</p>';
        return;
      }
      lista.textContent = '';
      cams.forEach(function (cam) {
        var uid = String(cam.uid || '').trim();
        if (!uid) return;
        var art = document.createElement('article');
        art.className = 'cam';
        art.setAttribute('data-uid', uid);

        var h = document.createElement('h2');
        h.textContent = uid;
        var st = document.createElement('span');
        st.className = 'status on';
        st.textContent = '● online';
        h.appendChild(st);
        art.appendChild(h);

        // Live MJPEG (same connection the browser reloads with F5).
        var img = document.createElement('img');
        img.id = 'live-' + uid;
        img.className = 'live';
        img.alt = 'Live feed of ' + uid;
        img.src = 'dev/' + encodeURIComponent(uid) + '/live';
        img.addEventListener('load', function () {
          st.textContent = '● online';
          st.className = 'status on';
        });
        img.addEventListener('error', function () {
          st.textContent = '● unreachable / busy';
          st.className = 'status off';
          mostrarError('Could not load the live feed of ' + uid +
            ' (503 camera busy with another viewer? Wait and reload).');
        });
        art.appendChild(img);

        var nav = document.createElement('nav');
        var aLive = document.createElement('a');
        aLive.href = 'dev/' + encodeURIComponent(uid) + '/live';
        aLive.textContent = 'Watch live (MJPEG)';
        nav.appendChild(aLive);

        var aSnap = document.createElement('a');
        aSnap.href = 'dev/' + encodeURIComponent(uid) + '/snapshot';
        aSnap.textContent = 'Snapshot (JPEG)';
        nav.appendChild(aSnap);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Save snapshot';
        var msg = document.createElement('p');
        msg.className = 'msg';
        msg.hidden = true;
        btn.addEventListener('click', function () {
          msg.hidden = true;
          // The server snapshots from the live stream cache, so the
          // feed keeps playing while saving.
          fetch('dev/' + encodeURIComponent(uid) + '/snapshot?save=1',
            { cache: 'no-store' })
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (j) {
              msg.textContent = 'Saved ' + j.saved;
              msg.hidden = false;
            })
            .catch(function (e) {
              mostrarError('Save failed: ' +
                String(e && e.message || e));
            });
        });
        nav.appendChild(btn);
        art.appendChild(nav);
        art.appendChild(msg);

        lista.appendChild(art);
      });
    })
    .catch(function (e) {
      lista.innerHTML = '<p>Could not load the camera list.</p>';
      mostrarError(String(e && e.message || e) +
        ' — serve this page from the same origin as the /dev/* proxy.');
    });
})();
</script>
</body>
</html>
