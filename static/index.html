<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera</title>
<style>
:root { color-scheme: dark;
  --bg: #0c0e12; --card: #161a22; --line: #262c3a;
  --txt: #eceef4; --mut: #98a1b3; --acc: #7c5cff; --ok: #3ddc84; --err: #ff6b6b; }
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--txt); }
header { padding: .8rem 1rem; background: #10141c; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 2; }
.top { display: flex; justify-content: space-between; align-items: center; }
.dot { color: var(--ok); font-size: .9rem; }
.dot.off { color: var(--err); }
.tabs { display: flex; gap: .4rem; margin-top: .6rem; }
.tabs button { flex: 1; padding: .6rem; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--mut); font-size: .95rem; }
.tabs button.on { background: var(--acc); color: #fff; border-color: var(--acc); font-weight: 700; }
main { max-width: 900px; margin: 0 auto; padding: 1rem; }
.view { display: none; }
.view.on { display: block; }
.live { width: 100%; aspect-ratio: 4/3; border-radius: 14px; background: #000; display: block; }
.live[hidden] { display: none; }
#countdown { text-align: center; padding: 1rem 0; }
#countdown[hidden] { display: none; }
.bar { display: flex; gap: .5rem; margin: .8rem 0; }
.bar button { flex: 1; padding: .8rem; font-size: 1.05rem; border-radius: 12px;
  background: var(--card); color: var(--txt); border: 1px solid var(--line); }
.bar button.pri { background: var(--acc); color: #fff; font-weight: 700; border: none; }
.pad { display: grid; grid-template-columns: repeat(3, 64px); gap: .4rem; justify-content: center; margin: .8rem 0; }
.pad button { padding: .9rem; font-size: 1.2rem; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--txt); touch-action: none; }
.pad button.on { background: var(--acc); color: #fff; }
.chips { display: flex; gap: .5rem; margin: 1rem 0 .25rem; flex-wrap: wrap; }
.chips button { padding: .45rem .9rem; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--mut); }
.chips button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.chips select { padding: .45rem .9rem; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--txt); }
h3.day { color: var(--mut); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; margin: 1.2rem 0 .5rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
.shot { border-radius: 12px; overflow: hidden; background: #0a0c11; border: 1px solid var(--line); }
.shot img, .shot video { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #000; }
.shot.sel { outline: 2px solid var(--acc); }
.shot .tm { padding: .4rem .6rem; font-size: .8rem; color: var(--mut); }
.src { font-size: .7rem; border: 1px solid var(--line); border-radius: 6px; padding: .1rem .35rem; }
.foot { display: flex; gap: .5rem; margin: 1rem 0 2rem; }
.foot button { flex: 1; padding: .7rem; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--txt); }
.bar button.gear { flex: none; width: 52px; font-size: 1.2rem; }
#settings { display: none; }
#settings.on { display: block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
.card h3 { margin-top: 0; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: .6rem .8rem; margin: 0 0 .5rem; }
.card .row label { flex: 1; min-width: 0; }
.card .row label.switch, .card .row .switch { flex: none; }
.card .row > span { flex: none; display: flex; align-items: center; gap: .35rem; }
.card .row input[type=number], .card .row select { flex: none; }
.hint { display: block; color: var(--mut); font-size: .8rem; }
input[type=number], select { padding: .4rem; border-radius: 8px; border: 1px solid var(--line);
  background: #0a0c11; color: var(--txt); }
input[type=number] { width: 90px; }
.switch { position: relative; width: 48px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: #3a4152; border-radius: 999px; transition: .2s; }
.slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + .slider { background: var(--ok); }
.switch input:checked + .slider::before { transform: translateX(22px); }
.save { width: 100%; padding: .8rem; border-radius: 10px; border: none; background: var(--acc); color: #fff; font-weight: 700; }
.msg { color: var(--ok); }
.error { color: var(--err); }
.nota { color: var(--mut); font-size: .85rem; }
.calhead { display: flex; align-items: center; justify-content: space-between; margin: 1rem 0 .5rem; }
.calhead strong { font-size: 1.05rem; }
.calhead button { padding: .5rem .9rem; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--txt); font-size: 1rem; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: .3rem; }
.cal .hd { color: var(--mut); font-size: .75rem; text-align: center; }
.cal button { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--txt); font-size: .85rem; }
.cal button.off { opacity: .3; }
.cal button.has { background: #fff; color: #111; font-weight: 700; border-color: #fff; }
.cal button.sel { outline: 2px solid var(--acc); }
#dayclips .row { display: flex; gap: .5rem; align-items: center; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; margin-bottom: .5rem; }
#dayclips .row span { flex: 1; }
#dayclips .row button { padding: .5rem .8rem; border-radius: 8px; border: 1px solid var(--line);
  background: #0a0c11; color: var(--txt); }
</style>
</head>
<body>
<header>
  <div class="top"><strong>Camera</strong><span class="dot" id="dot">waiting</span></div>
  <nav class="tabs" id="tabs">
    <button data-v="v-cam" class="on">Camera</button>
    <button data-v="v-rpi">RPi Gallery</button>
    <button data-v="v-sd">SD Gallery</button>
  </nav>
</header>
<main>
<noscript><p class="error">JavaScript is disabled or blocked for this site.</p></noscript>
  <p class="nota" id="build" hidden></p>

<section class="view on" id="v-cam">
  <div id="live-wrap"><img class="live" id="live" alt="Live feed"></div>
  <p class="msg" id="cmsg" hidden></p>
  <p class="error" id="cerror" hidden></p>
  <div id="countdown" hidden>
    <svg viewBox="0 0 120 120" width="120" height="120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#262c3a" stroke-width="10"/>
      <circle id="cd-arc" cx="60" cy="60" r="52" fill="none" stroke="#7c5cff" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"
        transform="rotate(-90 60 60)"/>
      <text id="cd-num" x="60" y="72" text-anchor="middle" font-size="30" fill="#eceef4">10</text>
    </svg>
    <p class="nota">Recording…</p>
  </div>
  <div class="bar">
    <button type="button" class="pri" id="save">Save snapshot</button>
    <button type="button" id="record">Record 10s clip</button>
    <button type="button" id="reload-live">Reload live</button>
    <button type="button" class="gear" id="cfg-toggle" aria-label="Settings">⚙</button>
  </div>
  <div id="settings">
    <div class="card">
      <h3>Automatic capture</h3>
      <div class="row">
        <label>Event capture<span class="hint">On / off</span></label>
        <label class="switch"><input type="checkbox" id="cfg-enabled"><span class="slider"></span></label>
      </div>
      <div id="cfg-auto-rows">
      <div class="row">
        <label>Capture mode<span class="hint">Shots / clips</span></label>
        <select id="cfg-mode"><option value="shots">Shots</option><option value="clips">Clips</option></select>
      </div>
      <div class="row">
        <label>Trigger<span class="hint">Motion / faces / both</span></label>
        <select id="cfg-trigger"><option value="motion">Motion</option><option value="faces">Faces</option><option value="both">Both</option></select>
      </div>
      <div id="cfg-clip-rows" style="display:none">
      <div class="row">
        <label>Clip length<span class="hint">Seconds per auto-clip</span></label>
        <span><input type="number" id="cfg-clipsec" min="3" max="60" step="1"> s</span>
      </div>
      <div class="row">
        <label>Clip cooldown<span class="hint">Gap between clips</span></label>
        <span><input type="number" id="cfg-cooldown" min="5" max="300" step="1"> s</span>
      </div>
      </div>
      <div class="row">
        <label>Check every<span class="hint">Seconds between grabs</span></label>
        <span><input type="number" id="cfg-interval" min="2" max="300" step="1"> s</span>
      </div>
      <div class="row">
        <label>Motion sensitivity<span class="hint">Lower = more</span></label>
        <input type="number" id="cfg-thresh" min="1" max="100" step="1">
      </div>
      </div>
    </div>
    <div class="card">
      <h3>Night vision</h3>
      <div class="row">
        <label>IR LED<span class="hint">Off / On (auto)</span></label>
        <select id="cfg-night"><option value="off">Off</option><option value="on">On</option></select>
      </div>
    </div>
    <button class="save" id="cfg-save">Save settings</button>
  </div>
  <div class="pad" id="pad" aria-label="PTZ controls">
    <span></span><button type="button" data-dir="3" aria-label="Up">▲</button><span></span>
    <button type="button" data-dir="2" aria-label="Left">◀</button><button type="button" data-dir="0" aria-label="Center">●</button><button type="button" data-dir="1" aria-label="Right">▶</button>
    <span></span><button type="button" data-dir="4" aria-label="Down">▼</button><span></span>
  </div>
</section>

<section class="view" id="v-rpi">
  <p class="msg" id="msg" hidden></p>
  <p class="error" id="error" hidden></p>
  <div class="chips" id="chips"><button data-day="" class="on">Today</button></div>
  <div class="chips" id="tools">
    <button data-f="all" class="on">All</button><button data-f="face">persona</button><button data-f="manual">manual</button><button data-f="automatic">automatic</button><button data-f="video">clips</button><button data-f="shot">shots</button><button data-f="file">sd</button>
    <select id="sort" aria-label="Sort">
      <option value="new">Newest</option>
      <option value="old">Oldest</option>
      <option value="big">Largest</option>
      <option value="small">Smallest</option>
    </select>
  </div>
  <div id="groups"></div>
  <div class="foot">
    <button id="selall">Select all</button>
    <button id="dl">Download selected</button>
    <button id="del">Delete selected</button>
  </div>
</section>

<section class="view" id="v-sd">
  <div class="calhead">
    <button id="mprev" aria-label="Previous month">◀</button>
    <strong id="mtitle">Month</strong>
    <button id="mnext" aria-label="Next month">▶</button>
  </div>
  <p class="error" id="sd-error" hidden></p>
  <div class="cal" id="cal"></div>
  <div id="dayclips" style="margin-top:1rem"></div>
  <p class="nota">Camera clock runs UTC. Downloading pauses camera recording while transferring. No delete yet: this firmware ignores delete commands.</p>
</section>

<p class="nota">One viewer at a time: an open live feed answers 503 camera busy to anything else.</p>
</main>
<script>
'use strict';
var UID = 'ap-camera';
var dotEl = document.getElementById('dot');
var liveEl = document.getElementById('live');
var msgEl = document.getElementById('msg');
var errEl = document.getElementById('error');
var groupsEl = document.getElementById('groups');
var chipsEl = document.getElementById('chips');
var buildEl = document.getElementById('build');
var selected = {};
function pad(n) { return String(n).padStart(2, '0'); }
var nowD = new Date();
var todayStr = '' + nowD.getFullYear() + pad(nowD.getMonth() + 1) + pad(nowD.getDate());
buildEl.textContent += ' js-ok';
window.onerror = function (m) {
  errEl.textContent = 'JS error: ' + m;
  errEl.hidden = false;
};
function say(t) {
  msgEl.textContent = t;
  msgEl.hidden = false;
  var c = document.getElementById('cmsg');
  if (c) { c.textContent = t; c.hidden = false; }
}
function fail(t) {
  errEl.textContent = t;
  errEl.hidden = false;
  var c = document.getElementById('cerror');
  if (c) { c.textContent = t; c.hidden = false; }
}
function cfail(t) {
  var c = document.getElementById('cerror');
  if (c) { c.textContent = t; c.hidden = false; }
}
function setLive(on, busy) {
  dotEl.textContent = on ? 'LIVE ' + UID : 'offline';
  dotEl.className = 'dot' + (on ? '' : ' off');
  if (busy) {
    dotEl.textContent += ' (busy: ' + busy + ')';
  }
}
function getJSON(url, ms) {
  var ctl = new AbortController();
  var t = setTimeout(function () { ctl.abort(); }, ms || 8000);
  return fetch(url, { cache: 'no-store', signal: ctl.signal }).then(
    function (r) {
      clearTimeout(t);
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    },
    function (e) { clearTimeout(t); throw e; });
}
function pollState() {
  getJSON('dev/list', 8000).then(
    function (cams) {
      var cam = Array.isArray(cams) && cams.filter(function (c) { return c.uid === UID; })[0];
      setLive(!!cam, cam && cam.busy);
    },
    function () { setLive(false); });
}
var liveRetries = 0;
function watchLive() {
  liveRetries = 0;
  liveEl.src = 'dev/' + UID + '/live?nocache=' + Date.now();
}
function pauseLive() {
  liveEl.removeAttribute('src');
}
liveEl.addEventListener('error', function () {
  if (liveRetries < 3) {
    liveRetries += 1;
    setTimeout(watchLive, 1500);
  } else {
    setLive(false);
  }
});
// Tabs: leaving Camera pauses the live feed (single-session camera).
  document.getElementById('tabs').onclick = tabsClick;
  function tabsClick(ev) {
    var b = ev.target.closest ? ev.target.closest('button') : null;
    if (!b) { return; }
    switchTab(b.getAttribute('data-v'));
  }
  function switchTab(v) {
    var btns = document.querySelectorAll('#tabs button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-v') === v);
    }
    var views = document.querySelectorAll('.view');
    for (var k = 0; k < views.length; k++) { views[k].classList.remove('on'); }
    document.getElementById(v).classList.add('on');
    if (v === 'v-cam') { watchLive(); } else { pauseLive(); }
  }
function kindBadge(s) {
  if (s.face) { return 'person-shot'; }
  if (s.kind === 'video') { return 'clip'; }
  if (s.kind === 'file') { return 'sd'; }
  if (s.src === 'auto') { return 'automatic-shot'; }
  return 'manual-shot';
}
function loadShots(day) {
  getJSON('dev/shots' + (day ? '?day=' + day : ''), 8000).then(
    function (shots) {
      lastGallerySig = gallerySig(shots);
      renderShots(filterShots(shots));
    },
    function (e) { fail('Gallery: ' + String((e && e.message) || e)); });
}
var lastGallerySig = '';
function gallerySig(shots) {
  return (shots || []).map(function (s) { return s.name + ':' + (s.bytes || 0); }).join('|');
}
// Auto-captures land without any click: refresh the gallery when something
// changed, but never while selecting (render wipes selection) and never
// off the gallery view.
function maybeRefreshGallery() {
  if (!document.getElementById('v-rpi').classList.contains('on')) { return; }
  if (Object.keys(selected).length) { return; }
  getJSON('dev/shots', 8000).then(function (shots) {
    var sig = gallerySig(shots);
    if (sig !== lastGallerySig) {
      lastGallerySig = sig;
      renderShots(filterShots(shots));
    }
  }, function () {});
}
var shotFilter = 'all';
var shotSort = 'new';
function filterShots(shots) {
  var out = (shots || []).filter(function (s) {
    if (shotFilter === 'face') { return !!s.face; }
    if (shotFilter === 'all') { return true; }
    if (shotFilter === 'manual') {
      return s.kind === 'shot' && s.src !== 'auto' && !s.face;
    }
    if (shotFilter === 'automatic') {
      return s.src === 'auto' && !s.face;
    }
    return s.kind === shotFilter;
  });
  function key(s) { return s.day + s.time.replace(/:/g, ''); }
  out.sort(function (a, b) {
    if (shotSort === 'old') { return key(a) < key(b) ? -1 : 1; }
    if (shotSort === 'big') { return (b.bytes || 0) - (a.bytes || 0); }
    if (shotSort === 'small') { return (a.bytes || 0) - (b.bytes || 0); }
    return key(a) < key(b) ? 1 : -1;
  });
  return out;
}
function renderShots(shots) {
      groupsEl.textContent = '';
      selected = {};
      var byDay = {};
      shots.forEach(function (s) {
        if (!byDay[s.day]) { byDay[s.day] = []; }
        byDay[s.day].push(s);
      });
      Object.keys(byDay).sort().reverse().forEach(function (day) {
        var h = document.createElement('h3');
        h.className = 'day';
        h.textContent = (day === todayStr) ? 'Today' : day;
        groupsEl.appendChild(h);
        var g = document.createElement('div');
        g.className = 'grid';
        byDay[day].forEach(function (s) {
          var d = document.createElement('div');
          d.className = 'shot';
          d.setAttribute('data-name', s.name);
          if (s.kind === 'video') {
            var v = document.createElement('video');
            v.controls = true;
            v.preload = 'metadata';
            v.src = 'dev/shots/' + encodeURIComponent(s.name);
            d.appendChild(v);
          } else if (s.kind === 'file') {
            var fim = document.createElement('img');
            fim.loading = 'lazy';
            fim.alt = s.name;
            fim.src = 'dev/shots/' + encodeURIComponent(s.name) + '/thumb';
            fim.onerror = function () { fim.style.display = 'none'; };
            d.appendChild(fim);
            var fa = document.createElement('a');
            fa.href = 'dev/shots/' + encodeURIComponent(s.name);
            fa.textContent = 'Download ' + s.name;
            d.appendChild(fa);
          } else {
            var im = document.createElement('img');
            im.loading = 'lazy';
            im.alt = s.name;
            im.src = 'dev/shots/' + encodeURIComponent(s.name);
            d.appendChild(im);
          }
          var tm = document.createElement('div');
          tm.className = 'tm';
          tm.textContent = s.time + ' ';
          var badge = document.createElement('span');
          badge.className = 'src';
          badge.textContent = kindBadge(s);
          tm.appendChild(badge);
          d.appendChild(tm);
          d.onclick = (function (name, el) {
            return function () {
              if (selected[name]) {
                delete selected[name];
                el.classList.remove('sel');
              } else {
                selected[name] = true;
                el.classList.add('sel');
              }
            };
          })(s.name, d);
          g.appendChild(d);
        });
        groupsEl.appendChild(g);
      });
}
document.getElementById('save').onclick = function () {
  msgEl.hidden = true;
  errEl.hidden = true;
  getJSON('dev/' + UID + '/snapshot?save=1', 15000).then(
    function (j) {
      say('Saved shot ' + j.saved + ' on Raspberry Pi');
      loadShots(null);
    },
    function (e) { fail('Save failed: ' + String((e && e.message) || e)); });
};
document.getElementById('record').onclick = function () {
  var cd = document.getElementById('countdown');
  var arc = document.getElementById('cd-arc');
  var num = document.getElementById('cd-num');
  liveEl.removeAttribute('src');
  liveEl.hidden = true;
  cd.hidden = false;
  var total = 10;
  var left = total;
  function draw() {
    num.textContent = left;
    arc.style.strokeDashoffset = (326.7 * (1 - left / total)).toFixed(1);
  }
  draw();
  var tick = setInterval(function () {
    left -= 1;
    if (left <= 0) { clearInterval(tick); }
    else { draw(); }
  }, 1000);
  function finish() {
    clearInterval(tick);
    cd.hidden = true;
    liveEl.hidden = false;
    watchLive();
  }
  say('Recording 10s clip…');
  fetch('dev/' + UID + '/clip?seconds=10', { method: 'POST', cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    })
    .then(function (j) {
      say('Saved clip ' + j.clip + ' on Raspberry Pi');
      loadShots(null);
      finish();
    })
    .catch(function (e) {
      fail('Record failed: ' + String((e && e.message) || e));
      finish();
    });
};
document.getElementById('reload-live').onclick = watchLive;
document.getElementById('cfg-toggle').onclick = function () {
  var card = document.getElementById('settings');
  var open = card.classList.toggle('on');
  if (open) { loadSettings(); }
};
function syncAutoRows() {
  var on = document.getElementById('cfg-enabled').checked;
  document.getElementById('cfg-auto-rows').style.display = on ? '' : 'none';
  syncClipRows();
}
function syncClipRows() {
  var on = document.getElementById('cfg-enabled').checked;
  var show = on && document.getElementById('cfg-mode').value === 'clips';
  document.getElementById('cfg-clip-rows').style.display = show ? '' : 'none';
}
document.getElementById('cfg-enabled').onchange = syncAutoRows;
document.getElementById('cfg-mode').onchange = syncClipRows;
function loadSettings() {
  getJSON('dev/settings', 8000).then(
    function (s) {
      document.getElementById('cfg-enabled').checked = !!s.facewatch_enabled;
      var cm = s.capture_mode || 'shots';
      if (cm === 'off') {
        // Legacy value: off-ness now lives in the toggle.
        cm = 'shots';
        document.getElementById('cfg-enabled').checked = false;
      }
      document.getElementById('cfg-mode').value = cm;
      document.getElementById('cfg-trigger').value = s.capture_trigger || 'both';
      document.getElementById('cfg-clipsec').value = s.clip_sec;
      document.getElementById('cfg-cooldown').value = s.clip_cooldown_sec;
      syncAutoRows();
      document.getElementById('cfg-interval').value = s.facewatch_interval_sec;
      document.getElementById('cfg-thresh').value = s.motion_thresh;
      document.getElementById('cfg-night').value = s.night_ir_mode;
    },
    function (e) { cfail('Settings load failed: ' + String((e && e.message) || e)); });
}
document.getElementById('cfg-save').onclick = function () {
  var body = {
    facewatch_enabled: document.getElementById('cfg-enabled').checked,
    capture_mode: document.getElementById('cfg-mode').value,
    capture_trigger: document.getElementById('cfg-trigger').value,
    clip_sec: parseFloat(document.getElementById('cfg-clipsec').value),
    clip_cooldown_sec: parseFloat(document.getElementById('cfg-cooldown').value),
    facewatch_interval_sec: parseFloat(document.getElementById('cfg-interval').value),
    motion_thresh: parseFloat(document.getElementById('cfg-thresh').value),
    night_ir_mode: document.getElementById('cfg-night').value
  };
  fetch('dev/settings', { method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body) })
    .then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' ' + t); });
      }
      return r.json();
    })
    .then(function (s) {
      var mode = s.night_ir_mode;
      if (mode === 'on' || mode === 'off') {
        return fetch('dev/' + UID + '/ir?on=' + (mode === 'on' ? '1' : '0'),
          { method: 'POST', cache: 'no-store' }).then(
          function (r) {
            if (!r.ok) { throw new Error('IR HTTP ' + r.status); }
            return r.json();
          }).then(function () { return s; });
      }
      return s;
    })
    .then(function () { say('Settings saved on Raspberry Pi'); })
    .catch(function (e) { cfail('Settings save failed: ' + String((e && e.message) || e)); });
};
document.getElementById('del').onclick = function () {
  var names = Object.keys(selected);
  if (!names.length) { say('Nothing selected.'); return; }
  if (!window.confirm('Delete ' + names.length + ' item(s) from the Pi?')) { return; }
  Promise.all(names.map(function (n) {
    return fetch('dev/shots/' + encodeURIComponent(n), { method: 'DELETE' });
  })).then(
    function () { loadShots(null); say('Deleted ' + names.length + '.'); },
    function (e) { fail('Delete failed: ' + String((e && e.message) || e)); });
};
document.getElementById('selall').onclick = function () {
  var cards = document.querySelectorAll('#groups .shot');
  var allSel = cards.length > 0;
  var i;
  for (i = 0; i < cards.length; i++) {
    if (!selected[cards[i].getAttribute('data-name')]) {
      allSel = false;
      break;
    }
  }
  for (i = 0; i < cards.length; i++) {
    var k = cards[i].getAttribute('data-name');
    if (allSel) {
      delete selected[k];
      cards[i].classList.remove('sel');
    } else {
      selected[k] = true;
      cards[i].classList.add('sel');
    }
  }
};
document.getElementById('dl').onclick = function () {
  var names = Object.keys(selected);
  if (!names.length) { say('Nothing selected.'); return; }
  names.forEach(function (n) {
    var a = document.createElement('a');
    a.href = 'dev/shots/' + encodeURIComponent(n);
    a.download = n;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
};
chipsEl.onclick = function (ev) {
  var b = ev.target.closest ? ev.target.closest('button') : null;
  if (!b) { return; }
  var btns = chipsEl.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('on'); }
  b.classList.add('on');
  loadShots(b.getAttribute('data-day') || null);
};
document.getElementById('tools').onclick = function (ev) {
  var b = ev.target.closest ? ev.target.closest('button') : null;
  if (!b) { return; }
  var btns = this.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('on'); }
  b.classList.add('on');
  shotFilter = b.getAttribute('data-f') || 'all';
  loadShots();
};
document.getElementById('sort').onchange = function () {
  shotSort = this.value;
  loadShots();
};
(function initPad() {
  var pad = document.getElementById('pad');
  var timer = null;
  function press(dir, btn, ms) {
    if (btn) { btn.classList.add('on'); }
    fetch('dev/' + UID + '/ptz?dir=' + dir + '&ms=' + (ms || 400),
      { method: 'POST', cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      })
      .catch(function (e) { fail('PTZ failed: ' + String((e && e.message) || e)); });
  }
  function release(btn) {
    if (btn) { btn.classList.remove('on'); }
    if (timer) { clearInterval(timer); timer = null; }
  }
  pad.querySelectorAll('button').forEach(function (btn) {
    var dir = btn.getAttribute('data-dir');
    btn.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      press(dir, btn, dir === '0' ? 80 : 400);
      if (dir !== '0') {
        timer = setInterval(function () { press(dir, null, 400); }, 500);
      }
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
      btn.addEventListener(ev, function () { release(btn); });
    });
  });
})();
var sdDates = [];
var calYear = nowD.getFullYear();
var calMonth = nowD.getMonth();
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
  'August', 'September', 'October', 'November', 'December'];
function renderCal() {
  var cal = document.getElementById('cal');
  var box = document.getElementById('dayclips');
  var present = {};
  sdDates.forEach(function (d) {
    if (String(d).substr(0, 6) === '' + calYear + pad(calMonth + 1)) {
      present[parseInt(String(d).substr(6, 2), 10)] = String(d);
    }
  });
  document.getElementById('mtitle').textContent = MONTHS[calMonth] + ' ' + calYear;
  cal.textContent = '';
  ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach(function (d) {
    var h = document.createElement('div');
    h.className = 'hd';
    h.textContent = d;
    cal.appendChild(h);
  });
  var first = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
  for (var i = 0; i < first; i++) { cal.appendChild(document.createElement('span')); }
  var dim = new Date(calYear, calMonth + 1, 0).getDate();
  for (var day = 1; day <= dim; day++) {
    (function (dd) {
      var b = document.createElement('button');
      b.textContent = dd;
      if (!present[dd]) { b.className = 'off'; }
      else {
        b.className = 'has';
        b.onclick = function () {
          var btns = cal.querySelectorAll('button');
          for (var k = 0; k < btns.length; k++) { btns[k].classList.remove('sel'); }
          b.classList.add('sel');
          loadSdDay(present[dd], b);
        };
      }
      cal.appendChild(b);
    })(day);
  }
  box.textContent = '';
}
function sdFail(t) {
  var e = document.getElementById('sd-error');
  e.textContent = t;
  e.hidden = false;
}
function sdClear() {
  var e = document.getElementById('sd-error');
  e.hidden = true;
}
function loadSdDay(date, btn) {
  sdClear();
  pauseLiveForSD();
  if (btn) { btn.disabled = true; }
  var done = function () { if (btn) { btn.disabled = false; } };
  var box = document.getElementById('dayclips');
  getJSON('dev/sd/files?date=' + date, 45000).then(
    function (j) {
      done();
      box.textContent = '';
      (j.files || []).forEach(function (f) {
        var hh = pad(f.hours);
        var mm = pad(f.minute);
        var r = document.createElement('div');
        r.className = 'row';
        var s = document.createElement('span');
        s.textContent = hh + ':' + mm;
        r.appendChild(s);
        var b = document.createElement('button');
        b.textContent = 'Download to Pi';
        b.onclick = function () {
          b.disabled = true;
          b.textContent = 'Downloading…';
          fetch('dev/sd/download?date=' + date + '&hours=' + f.hours +
            '&minute=' + f.minute, { method: 'POST', cache: 'no-store' })
            .then(function (rr) {
              if (!rr.ok) {
                return rr.text().then(function (t) {
                  throw new Error('HTTP ' + rr.status + ' ' + t);
                });
              }
              return rr.json();
            })
            .then(function (jj) {
              say('Saved ' + jj.file + ' (' + jj.bytes + 'B)' +
                (jj.mp4 ? ', plays as ' + jj.mp4 : ''));
              loadShots(null);
              b.textContent = 'Downloaded';
            })
            .catch(function (e) {
              fail('SD download failed: ' + String((e && e.message) || e));
              b.disabled = false;
              b.textContent = 'Download to Pi';
            });
        };
        r.appendChild(b);
        box.appendChild(r);
      });
      if (!box.hasChildNodes()) { box.textContent = 'No files that day.'; }
      done();
    },
    function (e) {
      done();
      sdFail('SD list failed: ' + String((e && e.message) || e) + ' — close other camera tabs/devices, then retry the day.');
    });
}
function pauseLiveForSD() {
  var live = document.getElementById('live');
  if (live) { live.removeAttribute('src'); }
}
document.getElementById('mprev').onclick = function () {
  calMonth -= 1;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  renderCal();
};
document.getElementById('mnext').onclick = function () {
  calMonth += 1;
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCal();
};
getJSON('dev/list', 8000).then(
  function (cams) {
    var found = Array.isArray(cams) && cams.some(function (c) { return c.uid === UID; });
    setLive(found);
    return getJSON('dev/sd/dates', 15000).then(
      function (j) { sdDates = j.dates || []; sdClear(); },
      function (e) {
        sdDates = [];
        sdFail('SD dates failed: ' + String((e && e.message) || e) +
          ' — Reload live, then reopen this tab.');
      }).then(function () { return found; });
  }).then(
  function (found) {
    renderCal();
    if (found) { watchLive(); } else { fail('Camera not registered.'); }
    loadShots(null);
    setInterval(pollState, 10000);
    setInterval(maybeRefreshGallery, 10000);
  },
  function (e) {
    setLive(false);
    renderCal();
    fail('Offline: ' + String((e && e.name === 'AbortError') ? 'timeout' : ((e && e.message) || e)));
    setInterval(pollState, 10000);
    setInterval(maybeRefreshGallery, 10000);
  });
</script>
